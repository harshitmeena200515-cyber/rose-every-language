<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🌹 For Pihu My Sweetheart - Forever Yours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #020104;
      color: #fff;
      font-family: 'Poppins', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Luxury Romantic Screen Frame */
    .app-screen {
      position: relative;
      width: 100vw;
      max-width: 460px;
      height: 100vh;
      max-height: 920px;
      background: radial-gradient(circle at 50% 25%, #2a0316 0%, #11020d 50%, #030005 100%);
      overflow: hidden;
      box-shadow: 0 0 60px rgba(255, 30, 86, 0.35), 0 0 100px rgba(0, 0, 0, 0.9);
      border-radius: 28px;
      border: 1.5px solid rgba(255, 75, 130, 0.3);
      display: flex;
      flex-direction: column;
    }

    /* Ambient Romantic Sparkle background */
    .sparkle-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Main Typography Rose Canvas */
    canvas#roseCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* Top Romantic Header */
    .header-bar {
      position: absolute;
      top: 18px;
      left: 0;
      right: 0;
      text-align: center;
      z-index: 30;
      pointer-events: none;
      padding: 0 16px;
    }
    .crown-tag {
      font-size: 0.75rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #ff9ebb;
      font-weight: 600;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
      margin-bottom: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .main-title {
      font-family: 'Great Vibes', cursive;
      font-size: clamp(2.3rem, 7vw, 2.8rem);
      background: linear-gradient(135deg, #fff 10%, #ff80ab 50%, #ff1744 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1.1;
      filter: drop-shadow(0 2px 18px rgba(255, 23, 68, 0.7));
    }
    .sub-title {
      font-size: 0.8rem;
      color: #ffd1dc;
      letter-spacing: 2px;
      font-weight: 400;
      margin-top: 4px;
    }

    /* Floating Heart Photo Bubbles */
    .photo-bubbles-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
    }
    .heart-bubble {
      position: absolute;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .heart-bubble:hover, .heart-bubble:active {
      transform: scale(1.15) !important;
      z-index: 50;
    }
    
    /* Heart Frame SVG Wrapper */
    .heart-frame {
      position: relative;
      filter: drop-shadow(0 4px 14px rgba(255, 23, 68, 0.65));
      animation: floatGently 4s ease-in-out infinite alternate;
    }
    @keyframes floatGently {
      0% { transform: translateY(0px) rotate(-2deg); }
      50% { transform: translateY(-7px) rotate(3deg); }
      100% { transform: translateY(0px) rotate(-2deg); }
    }
    .bubble-tag {
      background: rgba(18, 5, 14, 0.8);
      border: 1px solid rgba(255, 105, 180, 0.6);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 12px;
      margin-top: 3px;
      letter-spacing: 0.5px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    /* Specific Positions for 4 Photo Bubbles around the Rose */
    #bubble1 { top: 15%; left: 6%; }
    #bubble2 { top: 14%; right: 6%; }
    #bubble3 { top: 48%; left: 4%; }
    #bubble4 { top: 47%; right: 4%; }

    /* Floating Tapped Love Particles */
    .tap-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 40;
      overflow: hidden;
    }
    .floating-heart {
      position: absolute;
      font-size: 26px;
      animation: floatUpBurst 2.5s cubic-bezier(0.2, 0.8, 0.3, 1) forwards;
      pointer-events: none;
      filter: drop-shadow(0 0 10px rgba(255, 64, 129, 0.8));
    }
    @keyframes floatUpBurst {
      0% { opacity: 1; transform: translateY(0) scale(0.6) rotate(0deg); }
      50% { opacity: 0.95; transform: translateY(-320px) scale(1.3) rotate(20deg); }
      100% { opacity: 0; transform: translateY(-640px) scale(1.6) rotate(-25deg); }
    }

    /* Tap Explosion Pop */
    .tap-pop {
      position: absolute;
      pointer-events: none;
      font-size: 32px;
      transform: translate(-50%, -50%) scale(0);
      animation: popEffect 0.65s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      z-index: 55;
    }
    @keyframes popEffect {
      0% { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
      50% { transform: translate(-50%, -70px) scale(1.4) rotate(15deg); opacity: 1; }
      100% { transform: translate(-50%, -130px) scale(1) rotate(-15deg); opacity: 0; }
    }

    /* Bottom Romantic Dedicated Footer */
    .footer-bar {
      position: absolute;
      bottom: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 35;
      background: rgba(22, 6, 18, 0.7);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 64, 129, 0.3);
      border-radius: 35px;
      padding: 8px 14px 8px 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.6);
    }
    .dedicated-text {
      display: flex;
      flex-direction: column;
    }
    .dedicated-to {
      font-size: 0.68rem;
      color: #ff9ebb;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 500;
    }
    .dedicated-name {
      font-size: 1.05rem;
      font-weight: 700;
      background: linear-gradient(90deg, #fff, #ff80ab);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }
    .action-btn {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff1744, #f50057);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.35rem;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 23, 68, 0.6);
      border: 1.5px solid rgba(255, 255, 255, 0.4);
      transition: transform 0.15s ease;
      animation: pulseHeartBtn 2.2s infinite;
    }
    .action-btn:active {
      transform: scale(0.88);
    }
    @keyframes pulseHeartBtn {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* Modal / Popup for viewing Photo full size */
    .photo-modal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    .modal-heart-img {
      width: 250px;
      height: 250px;
      object-fit: cover;
      border-radius: 50%;
      border: 4px solid #ff4081;
      box-shadow: 0 0 35px rgba(255, 64, 129, 0.8);
      animation: zoomModal 0.35s cubic-bezier(0.18, 0.89, 0.32, 1.28);
    }
    @keyframes zoomModal {
      from { transform: scale(0.5); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .modal-quote {
      margin-top: 20px;
      font-family: 'Great Vibes', cursive;
      font-size: 2rem;
      color: #ff80ab;
      text-align: center;
      text-shadow: 0 0 15px rgba(255, 23, 68, 0.7);
    }
    .modal-close-btn {
      margin-top: 18px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 7px 22px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- SVG Definition for Perfect Heart Clip-Path -->
  <svg width="0" height="0" style="position: absolute;">
    <defs>
      <!-- Standardized 100x100 Heart Path -->
      <clipPath id="heartClip" clipPathUnits="objectBoundingBox">
        <path d="M 0.5, 0.85 
                 C 0.1, 0.55, 0, 0.35, 0, 0.25 
                 C 0, 0.1, 0.12, 0, 0.28, 0 
                 C 0.38, 0, 0.46, 0.08, 0.5, 0.16 
                 C 0.54, 0.08, 0.62, 0, 0.72, 0 
                 C 0.88, 0, 1, 0.1, 1, 0.25 
                 C 1, 0.35, 0.9, 0.55, 0.5, 0.85 Z" />
      </clipPath>
    </defs>
  </svg>

  <div class="app-screen" id="appScreen">

    <!-- Romantic Header -->
    <div class="header-bar">
      <div class="crown-tag">
        <span>✨</span> ONLY FOR PIHU <span>✨</span>
      </div>
      <div class="main-title">Pihu My Sweetheart</div>
      <div class="sub-title">MY LOVE • BITTU • FOREVER</div>
    </div>

    <!-- Background Star Sparkles -->
    <canvas class="sparkle-canvas" id="sparkleCanvas"></canvas>

    <!-- Main Typographic Rose Canvas -->
    <canvas id="roseCanvas" width="800" height="950"></canvas>

    <!-- 4 Beautiful Heart Photo Bubbles on Sides of the Rose -->
    <div class="photo-bubbles-layer">
      
      <!-- Bubble 1: Top-Left -->
      <div class="heart-bubble" id="bubble1" data-img="images/face1.jpg" data-quote="My Heart Beats Only For You, Pihu ❤️">
        <div class="heart-frame" style="width: 84px; height: 84px;">
          <svg viewBox="0 0 100 100" width="84" height="84">
            <!-- Glowing Heart Border -->
            <path d="M 50, 86 C 10, 56 0, 36 0, 26 C 0, 11 12, 1 28, 1 C 38, 1 46, 9 50, 17 C 54, 9 62, 1 72, 1 C 88, 1 100, 11 100, 26 C 100, 36 90, 56 50, 86 Z" fill="none" stroke="#ff4081" stroke-width="4" filter="drop-shadow(0 0 6px #ff1744)"/>
            <!-- Heart Cropped Image -->
            <image href="images/face1.jpg" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#heartClip)" />
          </svg>
        </div>
        <div class="bubble-tag">Pihu My Love 💕</div>
      </div>

      <!-- Bubble 2: Top-Right -->
      <div class="heart-bubble" id="bubble2" data-img="images/face2.jpg" data-quote="The Most Beautiful Smile in the World ✨">
        <div class="heart-frame" style="width: 86px; height: 86px; animation-delay: -1.5s;">
          <svg viewBox="0 0 100 100" width="86" height="86">
            <path d="M 50, 86 C 10, 56 0, 36 0, 26 C 0, 11 12, 1 28, 1 C 38, 1 46, 9 50, 17 C 54, 9 62, 1 72, 1 C 88, 1 100, 11 100, 26 C 100, 36 90, 56 50, 86 Z" fill="none" stroke="#ff0055" stroke-width="4" filter="drop-shadow(0 0 6px #ff0055)"/>
            <image href="images/face2.jpg" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#heartClip)" />
          </svg>
        </div>
        <div class="bubble-tag">My Sweetheart 💖</div>
      </div>

      <!-- Bubble 3: Mid-Left -->
      <div class="heart-bubble" id="bubble3" data-img="images/face3.jpg" data-quote="You Are My Cutest Bittu Forever 🥰">
        <div class="heart-frame" style="width: 82px; height: 82px; animation-delay: -0.8s;">
          <svg viewBox="0 0 100 100" width="82" height="82">
            <path d="M 50, 86 C 10, 56 0, 36 0, 26 C 0, 11 12, 1 28, 1 C 38, 1 46, 9 50, 17 C 54, 9 62, 1 72, 1 C 88, 1 100, 11 100, 26 C 100, 36 90, 56 50, 86 Z" fill="none" stroke="#ff4081" stroke-width="4" filter="drop-shadow(0 0 6px #ff4081)"/>
            <image href="images/face3.jpg" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#heartClip)" />
          </svg>
        </div>
        <div class="bubble-tag">Bittu 😘</div>
      </div>

      <!-- Bubble 4: Mid-Right -->
      <div class="heart-bubble" id="bubble4" data-img="images/face4.jpg" data-quote="I Love You More Than Anything In Life 🌹">
        <div class="heart-frame" style="width: 86px; height: 86px; animation-delay: -2.3s;">
          <svg viewBox="0 0 100 100" width="86" height="86">
            <path d="M 50, 86 C 10, 56 0, 36 0, 26 C 0, 11 12, 1 28, 1 C 38, 1 46, 9 50, 17 C 54, 9 62, 1 72, 1 C 88, 1 100, 11 100, 26 C 100, 36 90, 56 50, 86 Z" fill="none" stroke="#ff1744" stroke-width="4" filter="drop-shadow(0 0 6px #ff1744)"/>
            <image href="images/face4.jpg" width="100" height="100" preserveAspectRatio="xMidYMid slice" clip-path="url(#heartClip)" />
          </svg>
        </div>
        <div class="bubble-tag">I Love You ❤️</div>
      </div>

    </div>

    <!-- Floating Burst Taps Layer -->
    <div class="tap-layer" id="tapLayer"></div>

    <!-- Bottom Dedicated Bar -->
    <div class="footer-bar">
      <div class="dedicated-text">
        <span class="dedicated-to">Dedicated To</span>
        <span class="dedicated-name">Pihu (Bittu) ❤️</span>
      </div>
      <div class="action-btn" id="loveBurstBtn" title="Send Love Burst">
        💖
      </div>
    </div>

    <!-- Photo Zoom Modal -->
    <div class="photo-modal" id="photoModal">
      <img id="modalImg" class="modal-heart-img" src="" alt="Pihu">
      <div class="modal-quote" id="modalQuote">My Heart Beats Only For You ❤️</div>
      <button class="modal-close-btn" id="modalCloseBtn">Close 💕</button>
    </div>

  </div>

  <script>
    // --- Canvas & Typography Settings ---
    const W = 800;
    const H = 950;
    const GAP = 3.5;

    // ONLY the user's requested dedicated English romantic words
    const PHRASES = [
      "PIHU MY LOVE",
      "I LOVE YOU",
      "MY SWEETHEART",
      "BITTU",
      "PIHU",
      "MY LOVE",
      "SWEETHEART",
      "I LOVE U",
      "BITTU MY LOVE",
      "PIHU I LOVE YOU",
      "FOREVER YOURS",
      "MY BEAUTIFUL PIHU",
      "MY QUEEN",
      "MY JAAN",
      "ONLY YOU"
    ];

    // Elegant, glowing vibrant romantic palette
    const PETAL_COLORS = [
      "#ff1744", "#ff0055", "#f50057", "#e91e63",
      "#ff4081", "#ff5252", "#ff2a6d", "#ff7597",
      "#ff6b81", "#ff3366", "#d81b60", "#ff80ab",
      "#ff4d6d", "#c9184a", "#ff758f", "#fff0f5"
    ];

    const STEM_WORDS = [
      "PIHU", "MY LOVE", "BITTU", "LOVE", "I LOVE U", "FOREVER", "MY SWEETHEART"
    ];

    const LEAF_COLORS = [
      "#00e676", "#00c853", "#2ecc71", "#10ac84",
      "#1abc9c", "#05c46b", "#69f0ae", "#26de81"
    ];

    // Geometry of the Rose
    function isFlower(x, y) {
      const nx = (x - 400) / 185.0;
      const ny = (y - 325) / 175.0;
      if (nx * nx + ny * ny > 1.05) return false;
      if (ny > 0) {
        const maxW = (1.0 - ny * 0.72) * 1.05;
        if (Math.abs(nx) > maxW) return false;
      }
      if (ny < -0.4 && Math.abs(nx) < 0.22 && ny < -0.82) return false;
      return true;
    }

    function isStem(x, y) {
      if (y < 490 || y > 860) return false;
      const stemX = 400 + 15 * Math.sin((y - 490) * 0.013);
      return Math.abs(x - stemX) <= 9;
    }

    function isLeftLeaf(x, y) {
      const dx = x - 325;
      const dy = y - 615;
      const rad = -32 * (Math.PI / 180);
      const rx = dx * Math.cos(rad) - dy * Math.sin(rad);
      const ry = dx * Math.sin(rad) + dy * Math.cos(rad);
      return (rx / 75.0) ** 2 + (ry / 26.0) ** 2 <= 1.0;
    }

    function isRightLeaf(x, y) {
      const dx = x - 475;
      const dy = y - 680;
      const rad = 28 * (Math.PI / 180);
      const rx = dx * Math.cos(rad) - dy * Math.sin(rad);
      const ry = dx * Math.sin(rad) + dy * Math.cos(rad);
      return (rx / 72.0) ** 2 + (ry / 25.0) ** 2 <= 1.0;
    }

    function isCalyx(x, y) {
      if (y >= 490 && y <= 540) {
        const maxD = 48 * (1 - (y - 490) / 50);
        return Math.abs(x - 400) <= maxD + 8;
      }
      return false;
    }

    function collides(box, placed) {
      const [x1, y1, x2, y2] = box;
      for (let i = 0; i < placed.length; i++) {
        const [px1, py1, px2, py2] = placed[i];
        if (!(x2 < px1 || x1 > px2 || y2 < py1 || y1 > py2)) {
          return true;
        }
      }
      return false;
    }

    const canvas = document.getElementById('roseCanvas');
    const ctx = canvas.getContext('2d');
    const appScreen = document.getElementById('appScreen');
    const tapLayer = document.getElementById('tapLayer');

    let wordsToAnimate = [];
    let placedBoxes = [];
    let animIndex = 0;
    let animTimer = null;

    function generateWordPlan() {
      wordsToAnimate = [];
      placedBoxes = [];
      animIndex = 0;

      // 1. Petals with dynamic sizing
      const petalSizes = [11, 12, 13, 14, 16, 18, 20, 22];
      for (let i = 0; i < 2600; i++) {
        const cx = Math.floor(Math.random() * 420) + 190;
        const cy = Math.floor(Math.random() * 390) + 130;
        if (isFlower(cx, cy)) {
          const phrase = PHRASES[Math.floor(Math.random() * PHRASES.length)];
          const size = petalSizes[Math.floor(Math.random() * petalSizes.length)];
          ctx.font = `bold ${size}px "Poppins", "Segoe UI", sans-serif`;
          const textMetrics = ctx.measureText(phrase);
          const w = textMetrics.width;
          const h = size * 1.15;
          const box = [cx - w / 2 - GAP, cy - h / 2 - GAP, cx + w / 2 + GAP, cy + h / 2 + GAP];
          if (!collides(box, placedBoxes)) {
            placedBoxes.push(box);
            const color = PETAL_COLORS[Math.floor(Math.random() * PETAL_COLORS.length)];
            wordsToAnimate.push({ cx, cy, phrase, size, color });
          }
        }
      }

      // 2. Stem & Leaves
      const leafSizes = [10, 11, 12, 13];
      for (let i = 0; i < 1800; i++) {
        const cx = Math.floor(Math.random() * 360) + 220;
        const cy = Math.floor(Math.random() * 370) + 490;
        const inStem = isStem(cx, cy);
        const inLeft = isLeftLeaf(cx, cy);
        const inRight = isRightLeaf(cx, cy);
        const inCalyx = isCalyx(cx, cy);

        if (inStem || inLeft || inRight || inCalyx) {
          const phrase = inStem 
            ? STEM_WORDS[Math.floor(Math.random() * STEM_WORDS.length)]
            : PHRASES[Math.floor(Math.random() * PHRASES.length)];
          const size = leafSizes[Math.floor(Math.random() * leafSizes.length)];
          ctx.font = `bold ${size}px "Poppins", "Segoe UI", sans-serif`;
          const textMetrics = ctx.measureText(phrase);
          const w = textMetrics.width;
          const h = size * 1.15;
          const box = [cx - w / 2 - GAP, cy - h / 2 - GAP, cx + w / 2 + GAP, cy + h / 2 + GAP];
          if (!collides(box, placedBoxes)) {
            placedBoxes.push(box);
            const color = LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)];
            wordsToAnimate.push({ cx, cy, phrase, size, color });
          }
        }
      }

      // Bloom shuffle
      for (let i = wordsToAnimate.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [wordsToAnimate[i], wordsToAnimate[j]] = [wordsToAnimate[j], wordsToAnimate[i]];
      }
    }

    function drawBloom() {
      const batchSize = 3;
      for (let b = 0; b < batchSize; b++) {
        if (animIndex < wordsToAnimate.length) {
          const item = wordsToAnimate[animIndex];
          ctx.font = `bold ${item.size}px "Poppins", "Segoe UI", sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          
          // Glowing Text
          ctx.shadowColor = item.color;
          ctx.shadowBlur = 6;
          ctx.fillStyle = item.color;
          ctx.fillText(item.phrase, item.cx, item.cy);
          ctx.shadowBlur = 0;

          animIndex++;
        }
      }

      if (animIndex < wordsToAnimate.length) {
        animTimer = setTimeout(drawBloom, 20);
      }
    }

    function startAnimation() {
      if (animTimer) clearTimeout(animTimer);
      ctx.clearRect(0, 0, W, H);
      generateWordPlan();
      animTimer = setTimeout(drawBloom, 300);
    }

    // --- Sparkling Stars in Background ---
    const sCanvas = document.getElementById('sparkleCanvas');
    const sCtx = sCanvas.getContext('2d');
    let stars = [];

    function initSparkles() {
      sCanvas.width = appScreen.clientWidth || 400;
      sCanvas.height = appScreen.clientHeight || 750;
      stars = [];
      for (let i = 0; i < 45; i++) {
        stars.push({
          x: Math.random() * sCanvas.width,
          y: Math.random() * sCanvas.height,
          radius: Math.random() * 1.5 + 0.5,
          alpha: Math.random(),
          speed: Math.random() * 0.02 + 0.01
        });
      }
    }

    function animateSparkles() {
      sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);
      for (let s of stars) {
        s.alpha += s.speed;
        if (s.alpha > 1 || s.alpha < 0) s.speed = -s.speed;
        sCtx.fillStyle = `rgba(255, 192, 203, ${Math.abs(s.alpha)})`;
        sCtx.beginPath();
        sCtx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
        sCtx.fill();
      }
      requestAnimationFrame(animateSparkles);
    }

    // --- Romantic Tap Interactions ---
    const ROMANTIC_EMOJIS = ["❤️", "💖", "🌹", "✨", "💕", "🥰", "🌸", "💍"];

    function spawnFloatingHeart(xRatio) {
      const heart = document.createElement('div');
      heart.className = 'floating-heart';
      heart.textContent = ROMANTIC_EMOJIS[Math.floor(Math.random() * ROMANTIC_EMOJIS.length)];
      
      const x = xRatio !== undefined ? xRatio : (Math.random() * 80 + 10);
      heart.style.left = x + "%";
      heart.style.bottom = "80px";
      heart.style.animationDuration = (Math.random() * 1.2 + 2.0) + "s";
      
      tapLayer.appendChild(heart);
      setTimeout(() => heart.remove(), 2600);
    }

    appScreen.addEventListener('pointerdown', (e) => {
      // Ignore if clicking on modal or buttons
      if (e.target.closest('#photoModal') || e.target.closest('.action-btn')) return;

      const rect = appScreen.getBoundingClientRect();
      const clientX = e.clientX - rect.left;
      const clientY = e.clientY - rect.top;

      // Pop Emoji
      const pop = document.createElement('div');
      pop.className = 'tap-pop';
      pop.textContent = ROMANTIC_EMOJIS[Math.floor(Math.random() * ROMANTIC_EMOJIS.length)];
      pop.style.left = clientX + "px";
      pop.style.top = clientY + "px";
      appScreen.appendChild(pop);
      setTimeout(() => pop.remove(), 700);

      // Floating Hearts
      spawnFloatingHeart((clientX / rect.width) * 100);
    });

    // Continuous floating love ambient
    setInterval(() => {
      spawnFloatingHeart(Math.random() * 80 + 10);
    }, 900);

    // Love Burst Button Click
    document.getElementById('loveBurstBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      for (let i = 0; i < 14; i++) {
        setTimeout(() => {
          spawnFloatingHeart(Math.random() * 80 + 10);
        }, i * 65);
      }
    });

    // --- Photo Modal Click Handler ---
    const photoModal = document.getElementById('photoModal');
    const modalImg = document.getElementById('modalImg');
    const modalQuote = document.getElementById('modalQuote');
    const modalCloseBtn = document.getElementById('modalCloseBtn');

    document.querySelectorAll('.heart-bubble').forEach(bubble => {
      bubble.addEventListener('click', (e) => {
        e.stopPropagation();
        const imgSrc = bubble.getAttribute('data-img');
        const quote = bubble.getAttribute('data-quote');
        modalImg.src = imgSrc;
        modalQuote.textContent = quote;
        photoModal.style.display = 'flex';
      });
    });

    modalCloseBtn.addEventListener('click', () => {
      photoModal.style.display = 'none';
    });
    photoModal.addEventListener('click', (e) => {
      if (e.target === photoModal) photoModal.style.display = 'none';
    });

    // Start everything
    window.addEventListener('resize', initSparkles);
    initSparkles();
    animateSparkles();
    startAnimation();
  </script>
</body>
</html>
